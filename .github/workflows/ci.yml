name: Public source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.11"
      - name: Validate sources and public boundary
        run: julia --color=yes test/runtests.jl
      - name: Instantiate and load package
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.instantiate(); using ParameterCalibration'
